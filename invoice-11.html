<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hóa đơn bán hàng</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f7;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: #1e293b;
            padding: 15px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .invoice-wrapper {
            max-width: 1000px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            padding: 18px 24px 16px;
            transition: all 0.2s;
            border: 1px solid #e9edf2;
        }

        .no-print {
            display: inline-block;
        }

        /* ----- HEADER (chỉ còn tên cửa hàng) ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 3px solid #1e3a8a;
            flex-wrap: wrap;
            gap: 10px;
        }

        .company .name {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            border: none;
            border-bottom: 2px dotted #94a3b8;
            padding: 0 0 2px 0;
            background: transparent;
            outline: none;
            min-width: 160px;
        }

        /* ----- TITLE (nền màu) ----- */
        .title-section {
            text-align: center;
            margin: 10px 0 8px;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            padding: 10px 12px;
            border-radius: 12px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 16px;
        }
        .title-section h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 0;
        }
        .title-section .sub {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            font-size: 12px;
            color: #f0f4ff;
        }
        .title-section .sub label {
            font-weight: 500;
            color: #dbeafe;
        }
        .title-section .sub input {
            border: none;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.6);
            background: transparent;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 6px;
            width: 120px;
            text-align: center;
            color: #fff;
            transition: border 0.2s;
        }
        .title-section .sub input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .title-section .sub input:focus {
            outline: none;
            border-bottom-color: #facc15;
        }
        .title-section .sub .barcode-wrap svg {
            height: 30px;
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 6px;
        }
        .date-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .date-group input {
            width: 30px;
            text-align: center;
            border: none;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.6);
            background: transparent;
            font-size: 12px;
            padding: 2px;
            color: #fff;
        }
        .date-group input:focus {
            outline: none;
            border-bottom-color: #facc15;
        }
        .date-group input:nth-child(3) {
            width: 50px;
        }

        /* ----- CUSTOMER INFO (chỉ còn tên khách hàng) ----- */
        .customer-info {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 20px;
            background: #f1f5f9;
            padding: 8px 16px;
            border-radius: 8px;
            margin: 8px 0 10px;
            border-left: 4px solid #2563eb;
        }
        .customer-info label {
            font-weight: 600;
            color: #1e293b;
            font-size: 12px;
        }
        .customer-info input {
            border: none;
            border-bottom: 2px dashed #94a3b8;
            background: transparent;
            font-size: 13px;
            padding: 2px 6px;
            min-width: 140px;
            transition: border 0.2s;
        }
        .customer-info input:focus {
            outline: none;
            border-bottom-color: #2563eb;
        }

        /* ----- TABLE (màu sắc) ----- */
        .table-wrap {
            overflow-x: auto;
            margin: 4px 0 8px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 550px;
        }
        .table th {
            background: linear-gradient(to right, #2563eb, #1d4ed8);
            color: white;
            font-weight: 600;
            padding: 8px 6px;
            border-bottom: 2px solid #1e3a8a;
            text-align: center;
            white-space: nowrap;
        }
        .table td {
            padding: 4px 4px;
            border-bottom: 1px solid #eef2f6;
            vertical-align: middle;
            text-align: center;
        }
        .table tr:last-child td {
            border-bottom: none;
        }
        .table tbody tr:hover {
            background: #f8fafc;
        }

        .table td .name-cell {
            min-width: 100px;
            text-align: left;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: text;
            font-weight: 500;
            color: #0f172a;
            display: block;
        }
        .table td .name-cell:focus {
            outline: 2px solid #bfdbfe;
            background: #ffffff;
        }

        .table td input {
            width: 100%;
            min-width: 40px;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 12px;
            padding: 2px 2px;
            border-radius: 4px;
        }
        .table td input:focus {
            outline: 2px solid #bfdbfe;
            background: #ffffff;
        }
        .table td input[type="number"] {
            -moz-appearance: textfield;
        }
        .table td input[type="number"]::-webkit-outer-spin-button,
        .table td input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .table td:first-child {
            background: #eff6ff;
            font-weight: 700;
            color: #1e3a8a;
            width: 30px;
        }

        .table td .line-total {
            font-weight: 600;
            color: #0f172a;
        }

        .table td .del-btn {
            background: #fee2e2;
            color: #b91c1c;
            border: none;
            border-radius: 6px;
            width: 24px;
            height: 24px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .table td .del-btn:hover {
            background: #fecaca;
            transform: scale(1.05);
        }

        .add-row-btn {
            margin-top: 4px;
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            color: #1e40af;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .add-row-btn:hover {
            background: #dbeafe;
            border-color: #93b3f8;
        }

        /* ----- BOTTOM: TOTALS + QR ----- */
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
            align-items: stretch;
        }

        .totals {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px 18px;
            border: 1px solid #e2e8f0;
        }
        .totals .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 13px;
        }
        .totals .row.total {
            font-weight: 700;
            font-size: 16px;
            border-top: 2px solid #e2e8f0;
            margin-top: 4px;
            padding-top: 8px;
        }
        .totals .row .label {
            font-weight: 500;
            color: #475569;
        }
        .totals .row .value {
            font-weight: 600;
        }
        .totals .row.discount input {
            width: 60px;
            border: none;
            border-bottom: 2px dashed #94a3b8;
            background: transparent;
            text-align: right;
            font-size: 13px;
            font-weight: 600;
            padding: 2px 4px;
        }
        .totals .row.discount input:focus {
            outline: none;
            border-bottom-color: #2563eb;
        }

        .totals .final {
            background: linear-gradient(135deg, #f97316, #dc2626);
            border-radius: 10px;
            padding: 10px 16px;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(220, 38, 38, 0.25);
        }

        .qr-panel {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            border: 1px solid #e2e8f0;
        }
        .qr-panel .bank-info {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 12px;
            justify-content: center;
            font-size: 12px;
        }
        .qr-panel .bank-info label {
            font-weight: 500;
            color: #475569;
            white-space: nowrap;
        }
        .qr-panel .bank-info select,
        .qr-panel .bank-info input {
            border: none;
            border-bottom: 2px dashed #94a3b8;
            background: transparent;
            padding: 2px 4px;
            font-size: 12px;
            min-width: 100px;
        }
        .qr-panel .bank-info select:focus,
        .qr-panel .bank-info input:focus {
            outline: none;
            border-bottom-color: #2563eb;
        }
        .qr-panel img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            background: white;
            border-radius: 10px;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-top: 2px;
        }

        /* ----- FOOTER ----- */
        .footer {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            margin-top: 14px;
            border-top: 1px solid #f1f5f9;
            padding-top: 10px;
        }

        /* ----- PRINT (1 trang A4) ----- */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .invoice-wrapper {
                box-shadow: none;
                border-radius: 0;
                padding: 10px 14px;
                max-width: 100%;
                border: none;
            }
            .no-print {
                display: none !important;
            }
            .title-section {
                background: #1e3a8a !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .title-section .sub input,
            .title-section .sub .barcode-wrap svg {
                color: #fff !important;
            }
            .table th {
                background: #2563eb !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                color: #fff !important;
            }
            .table td:first-child {
                background: #eff6ff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .totals .final {
                background: linear-gradient(135deg, #f97316, #dc2626) !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                color: #fff !important;
            }
            .customer-info {
                background: #f1f5f9 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                border-left-color: #2563eb !important;
            }
            .qr-panel,
            .totals {
                background: #f8fafc !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .invoice-wrapper {
                padding: 8px 12px !important;
            }
            .title-section {
                padding: 6px 12px !important;
                margin: 6px 0 !important;
            }
            .title-section h1 {
                font-size: 16px !important;
            }
            .customer-info {
                padding: 5px 12px !important;
                margin: 4px 0 6px !important;
            }
            .table th {
                padding: 5px 4px !important;
                font-size: 11px !important;
            }
            .table td {
                padding: 2px 3px !important;
                font-size: 11px !important;
            }
            .bottom-grid {
                gap: 12px !important;
                margin-top: 4px !important;
            }
            .totals {
                padding: 8px 12px !important;
            }
            .totals .row {
                font-size: 12px !important;
                padding: 2px 0 !important;
            }
            .totals .final {
                font-size: 15px !important;
                padding: 6px 12px !important;
            }
            .qr-panel {
                padding: 8px 10px !important;
            }
            .qr-panel img {
                width: 90px !important;
                height: 90px !important;
            }
            .footer {
                margin-top: 6px !important;
                padding-top: 6px !important;
                font-size: 10px !important;
            }
            .add-row-btn {
                display: none !important;
            }
            .header {
                padding-bottom: 6px !important;
            }
            .company .name {
                font-size: 16px !important;
            }
        }

        @media (max-width: 700px) {
            .bottom-grid {
                grid-template-columns: 1fr;
            }
            .title-section {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .title-section .sub {
                justify-content: center;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

<div class="invoice-wrapper">

    <!-- HEADER (chỉ còn tên cửa hàng, không logo, không địa chỉ) -->
    <div class="header">
        <div class="company">
            <input class="name" value="CỬA HÀNG ABC" />
        </div>
        <!-- Đã bỏ logo và địa chỉ -->
    </div>

    <!-- TITLE (có nền màu) -->
    <div class="title-section">
        <h1>HÓA ĐƠN BÁN HÀNG</h1>
        <div class="sub">
            <span class="barcode-wrap">
                <label>Mã</label>
                <input id="invoiceId" value="HD00001" oninput="updateAll()" />
                <svg id="barcode"></svg>
            </span>
            <span class="date-group">
                <label>Ngày</label>
                <input placeholder="DD" /> / <input placeholder="MM" /> / <input placeholder="YYYY" />
            </span>
        </div>
    </div>

    <!-- CUSTOMER INFO (chỉ còn tên khách hàng, bỏ SĐT) -->
    <div class="customer-info">
        <label>Khách hàng</label>
        <input value="NGUYỄN VĂN A" />
        <!-- Đã bỏ SĐT -->
    </div>

    <!-- TABLE -->
    <div class="table-wrap">
        <table class="table">
            <thead>
                <tr>
                    <th style="width:6%;">STT</th>
                    <th style="width:36%;">Tên hàng</th>
                    <th style="width:10%;">ĐVT</th>
                    <th style="width:10%;">SL</th>
                    <th style="width:16%;">Đơn giá</th>
                    <th style="width:16%;">Thành tiền</th>
                    <th style="width:6%;" class="no-print"></th>
                </tr>
            </thead>
            <tbody id="items"></tbody>
        </table>
    </div>
    <button class="add-row-btn no-print" onclick="addItem()">
        <i class="fas fa-plus-circle"></i> Thêm dòng
    </button>

    <!-- BOTTOM: TOTALS + QR -->
    <div class="bottom-grid">
        <div class="totals">
            <div class="row">
                <span class="label">Tổng tiền</span>
                <span class="value" id="total">0</span>
            </div>
            <div class="row discount">
                <span class="label">Giảm (%)</span>
                <input id="discount" type="number" value="0" oninput="updateAll()" />
            </div>
            <div class="final">
                <span>Thanh toán</span>
                <span id="final">0</span>
            </div>
        </div>

        <div class="qr-panel">
            <div class="bank-info">
                <label>Ngân hàng</label>
                <select id="bank" onchange="updateQR()">
                    <option value="VCB">Vietcombank</option>
                    <option value="ABB">ABBank</option>
                    <option value="SHBVN">SOL</option>
                    <option value="ACB">ACB</option>
                    <option value="AGRIBANK">Agribank</option>
                    <option value="BAB">Bac A Bank</option>
                    <option value="BAOVIETBANK">BaoViet Bank</option>
                    <option value="BIDV">BIDV</option>
                    <option value="BVB">BVBank</option>
                    <option value="EIB">Eximbank</option>
                    <option value="HDB">HDBank</option>
                    <option value="ICB">VietinBank</option>
                    <option value="KLB">KienlongBank</option>
                    <option value="MB">MB Bank</option>
                    <option value="MSB">MSB</option>
                    <option value="NAB">Nam A Bank</option>
                    <option value="OCB">OCB</option>
                    <option value="PGB">PG Bank</option>
                    <option value="PVCOMBANK">PVcomBank</option>
                    <option value="SAIGONBANK">SaigonBank</option>
                    <option value="SCB">SCB</option>
                    <option value="SEAB">SeABank</option>
                    <option value="SHB">SHB</option>
                    <option value="STB">Sacombank</option>
                    <option value="TCB">Techcombank</option>
                    <option value="TPB">TPBank</option>
                    <option value="VIB">VIB</option>
                    <option value="VPB">VPBank</option>
                    <option value="NCB">NCB</option>
                </select>
            </div>
            <div class="bank-info">
                <label>Số TK</label>
                <input id="account" value="0123456789" oninput="updateQR()" />
                <label>Chủ TK</label>
                <input id="owner" value="NGUYEN VAN A" oninput="updateQR()" />
            </div>
            <img id="qr" alt="QR thanh toán" />
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        Cảm ơn quý khách đã mua hàng!
    </div>

    <button class="btn no-print" onclick="window.print()" style="margin-top:12px; background:#2563eb; color:white; border:none; padding:8px 24px; border-radius:40px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:8px; font-size:13px; transition:0.15s;">
        <i class="fas fa-print"></i> In hóa đơn
    </button>
</div>

<script>
    const items = document.getElementById('items');

    function addItem(name = '', qty = 1, price = 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="stt"></td>
            <td><span class="name-cell" contenteditable="true">${name}</span></td>
            <td><input type="text" value="" /></td>
            <td><input type="number" value="${qty}" /></td>
            <td><input type="number" value="${price}" /></td>
            <td class="line-total">0</td>
            <td class="no-print"><button class="del-btn" onclick="this.closest('tr').remove();updateAll()"><i class="fas fa-times"></i></button></td>
        `;
        items.appendChild(tr);

        tr.querySelectorAll('input').forEach(i => i.oninput = updateAll);
        tr.querySelector('.name-cell').oninput = updateAll;
        updateAll();
    }

    function fmt(n) {
        return (n || 0).toLocaleString('vi-VN');
    }

    function updateAll() {
        let sum = 0;
        [...items.children].forEach((tr, i) => {
            tr.children[0].textContent = i + 1;
            const q = +tr.children[3].querySelector('input').value || 0;
            const p = +tr.children[4].querySelector('input').value || 0;
            const t = q * p;
            tr.querySelector('.line-total').textContent = fmt(t);
            sum += t;
        });

        const d = +document.getElementById('discount').value || 0;
        const pay = Math.round(sum * (1 - d / 100));
        document.getElementById('total').textContent = fmt(sum);
        document.getElementById('final').textContent = fmt(pay);

        JsBarcode('#barcode', document.getElementById('invoiceId').value, {
            displayValue: false,
            height: 30,
            width: 2,
        });
        updateQR();
    }

    function updateQR() {
        const amount = document.getElementById('final').textContent.replace(/\D/g, '');
        const bank = document.getElementById('bank').value;
        const account = document.getElementById('account').value;
        const owner = document.getElementById('owner').value;
        const invoiceId = document.getElementById('invoiceId').value;
        document.getElementById('qr').src =
            `https://img.vietqr.io/image/${bank}-${account}-compact2.png?amount=${amount}&addInfo=${invoiceId}&accountName=${owner}`;
    }

    window.onload = () => {
        addItem('Sản phẩm 1', 1, 100000);
        addItem('Sản phẩm 2', 2, 50000);
    };
</script>
</body>
</html>
