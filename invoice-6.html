<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Invoice</title>

    <style>
      @page { size: A4; margin: 20mm; }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f2f2f2;
        color: #222;
      }

      .invoice {
        max-width: 800px;
        margin: auto;
        background: #fff;
        padding: 30px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      /* HEADER */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      .brand { display: flex; gap: 12px; }
      .brand input { border: none; font-size: 18px; font-weight: 600; }
      .brand .small { font-size: 13px; color: #555; }

      .invoice-title { text-align: right; }
      .invoice-title h1 { margin: 0; letter-spacing: 2px; }

      .invoice-meta { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
      .invoice-meta div { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
      .invoice-meta input {
        border: none;
        border-bottom: 1px dashed #aaa;
        background: transparent;
        text-align: right;
        padding: 2px;
      }
      .invoice-meta input:focus { outline: none; border-bottom-style: solid; }
      .invoice-meta input#invoiceId { width: 150px; }
      .invoice-meta input.d  { width: 32px; text-align: center; }
      .invoice-meta input.yr { width: 50px; text-align: center; }

      /* INFO */
      .info { display: flex; justify-content: space-between; margin-top: 40px; }
      .info h3 { font-size: 13px; letter-spacing: 1px; }
      .info input { border: none; display: block; margin: 2px 0; width: 260px; }

      /* TABLE */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 40px;
        font-size: 14px;
        table-layout: fixed; /* Cố định độ rộng cột */
      }
      thead th {
        text-align: left;
        border-bottom: 2px solid #333;
        padding: 8px;
      }
      tbody td {
        border-bottom: 1px solid #ddd;
        padding: 8px;
      }

      /* Căn chỉnh cột */
      .right { text-align: right; }
      .center { text-align: center; }

      /* Độ rộng các cột */
      th.col-name  { width: auto; }   /* Tên sản phẩm tự giãn */
      th.col-qty   { width: 80px; white-space: nowrap; }   /* Số lượng vừa đủ 1 hàng */
      th.col-price { width: 95px; }   /* Giá nhỏ */
      th.col-total { width: 95px; }   /* Tổng nhỏ */
      th.col-del   { width: 25px; }   /* Nút xoá */

      td input {
        width: 100%;
        border: none;
        background: transparent;
        box-sizing: border-box;
      }

      /* Ô số lượng — căn phải, ẩn mũi tên tăng giảm */
      .qty {
        text-align: right;
        width: 100%;
        background: transparent;
        border: none;
      }
      input[type=number]::-webkit-inner-spin-button,
      input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type=number] {
        -moz-appearance: textfield;
      }

      /* Ô đơn giá — căn phải, số thẳng hàng */
      .price {
        text-align: right;
        font-variant-numeric: tabular-nums;
        width: 100%;
        background: transparent;
        border: none;
      }

      .delete { color: #c00; cursor: pointer; }

      /* TOTAL */
      .total-box { margin-top: 20px; width: 260px; margin-left: auto; }
      .total-box div { display: flex; justify-content: space-between; padding: 4px 0; }
      .total-box .final {
        font-weight: bold;
        border-top: 2px solid #333;
        padding-top: 6px;
      }

      /* ==== BANK GRID 2 CỘT ==== */
      .bank-grid {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #ddd;
        display: grid;
        grid-template-columns: 1fr 260px;
        gap: 30px;
        align-items: start;
      }

      .bank { margin: 0; }
      .bank-row {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 8px;
        margin: 6px 0;
      }
      .bank input, .bank select { border: none; width: 100%; border-bottom: 1px dashed #ccc; padding: 3px 0; }

      /* QR — thu nhỏ, khung tự co */
      .qr-cell { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
      #qr {
        display: inline-block;
        padding: 6px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
        line-height: 0;
      }
      #qr img {
        display: block !important;
        width: 110px !important;
        height: 110px !important;
        image-rendering: -webkit-optimize-contrast;
      }

      /* Ghi chú dưới QR */
      .qr-note {
        margin-top: 4px;
        font-size: 10px;
        color: #4b5563;
        line-height: 1.5;
        text-align: center;
      }
      .qr-note p { margin: 2px 0; }
      .qr-note p:first-child { font-weight: 600; color: #111827; }

      /* ACTIONS */
      .actions { margin-top: 30px; display: flex; gap: 10px; }
      button { padding: 8px 14px; border: none; cursor: pointer; }
      .add { background: #eee; }
      .print { background: #111; color: #fff; }

      /* PRINT */
      .print-only { display: none; }

      @media print {
        body { background: #fff; }
        .no-print { display: none; }
        input, select { pointer-events: none; }

        .bank-grid { page-break-inside: avoid; break-inside: avoid; }
        #qr {
          display: inline-block !important;
          padding: 6px !important;
        }
        #qr img {
          width: 110px !important;
          height: 110px !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
    </style>

    <!-- Thư viện sinh QR client-side (nhẹ, không logo) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  </head>

  <body>
    <div class="invoice">
      <!-- HEADER -->
      <div class="header">
        <div class="brand">
          <div>
            <input value="Arrowai Industries" />
          </div>
        </div>

        <div class="invoice-title">
          <h1>Hóa Đơn</h1>
          <div class="invoice-meta">
            <div>
              <span>Mã HĐ:</span>
              <input id="invoiceId" value="HD000001" />
            </div>
            <div>
              Ngày <input id="dateD" class="d" maxlength="2" />
              tháng <input id="dateM" class="d" maxlength="2" />
              năm <input id="dateY" class="yr" maxlength="4" />
            </div>
          </div>
        </div>
      </div>

      <!-- INFO -->
      <div class="info">
        <div>
          <h3>KHÁCH HÀNG:</h3>
          <input value="Pedro Fernandes" />
        </div>
      </div>

      <!-- TABLE -->
      <table>
        <thead>
          <tr>
            <th class="col-name">TÊN</th>
            <th class="right col-qty">SỐ LƯỢNG</th>
            <th class="right col-price">GIÁ</th>
            <th class="right col-total">TỔNG</th>
            <th class="no-print col-del"></th>
          </tr>
        </thead>
        <tbody id="items"></tbody>
      </table>

      <!-- TOTAL -->
      <div class="total-box">
        <div class="final">
          <span>TỔNG CỘNG:</span><span id="total">0</span>
        </div>
      </div>

      <!-- ==== BANK GRID: 2 CỘT ==== -->
      <div class="bank-grid">

        <div class="bank">
          <div class="bank-row">
            <span>NGÂN HÀNG</span>
            <select id="bank" onchange="syncQR()">
              <option value="VCB">Vietcombank</option>
              <option value="ABB">ABBank</option>
              <option value="SHBVN">SOL</option>
              <option value="ACB">ACB</option>
              <option value="AGRIBANK">Agribank</option>
              <option value="BAB">Bac A Bank</option>
              <option value="BAOVIETBANK">BaoViet Bank</option>
              <option value="BIDV">BIDV</option>
              <option value="BVB">BVBank</option>
              <option value="EIB">Eximbank</option>
              <option value="HDB">HDBank</option>
              <option value="ICB">VietinBank</option>
              <option value="KLB">KienlongBank</option>
              <option value="MB">MB Bank</option>
              <option value="MSB">MSB</option>
              <option value="NAB">Nam A Bank</option>
              <option value="OCB">OCB</option>
              <option value="PGB">PG Bank</option>
              <option value="PVCOMBANK">PVcomBank</option>
              <option value="SAIGONBANK">SaigonBank</option>
              <option value="SCB">SCB</option>
              <option value="SEAB">SeABank</option>
              <option value="SHB">SHB</option>
              <option value="STB">Sacombank</option>
              <option value="TCB">Techcombank</option>
              <option value="TPB">TPBank</option>
              <option value="VIB">VIB</option>
              <option value="VPB">VPBank</option>
              <option value="NCB">NCB</option>
              <option value="VIKKI">VIKKI</option>
               <option value="LPB">LOCPHATBANK</option>
                <option value="CAKE">CAKE By VPBANK</option>
            </select>
          </div>
          <div class="bank-row">
            <span>Số Tài Khoản</span>
            <input id="account" value="0123456789" oninput="syncQR()" />
          </div>
          <div class="bank-row">
            <span>Chủ Tài Khoản</span>
            <input id="owner" value="NGUYEN VAN A" oninput="syncQR()" />
          </div>
          <div class="bank-row">
            <span>Nội dung</span>
            <input id="content" value="Thanh toán hóa đơn" oninput="syncQR()"  style="width: 400px;"/>
          </div>
        </div>

        <div class="qr-cell">
          <div id="qr"></div>

          <div class="qr-note">
            <p>Vui lòng quét mã QR để thanh toán trong vòng 2 giờ từ khi mua hàng.</p>
            <p>Chúng tôi từ chối trách nhiệm trong trường hợp quý khách hàng nhập thông tin hóa đơn không đúng.</p>
          </div>
        </div>

      </div>

      <!-- ACTIONS -->
      <div class="actions no-print">
        <button class="add" onclick="addRow()">+ Add Row</button>
        <button class="print" onclick="window.print()">Print</button>
      </div>
    </div>

    <script>
      // ============================================================
      //  MÃ BIN NGÂN HÀNG (theo NAPAS - dùng cho VietQR EMVCo)
      // ============================================================
      const BANK_BIN = {
        VCB: "970436", TCB: "970407", ICB: "970415", BIDV: "970418",
        AGRIBANK: "970405", MB: "970422", ACB: "970416", VPB: "970432",
        TPB: "970423", STB: "970403", HDB: "970437", SHB: "970443",
        VIB: "970441", MSB: "970426", OCB: "970448", SEAB: "970440",
        EIB: "970431", NAB: "970428", SCB: "970429", PGB: "970430",
        KLB: "970452", BVB: "970454", BAOVIETBANK: "970438",
        PVCOMBANK: "970412", SAIGONBANK: "970400", ABB: "970425",
        NCB: "970419", SHBVN: "970409", BAB: "970409", VIKKI: "970406", LPB: "970449",  CAKE: "546034"
      };

      // TLV: tag + length (2 số) + value
      function tlv(tag, val) {
        const len = String(val.length).padStart(2, "0");
        return tag + len + val;
      }

      // CRC-16/CCITT-FALSE (chuẩn EMVCo)
      function crc16(str) {
        let crc = 0xffff;
        for (let i = 0; i < str.length; i++) {
          crc ^= str.charCodeAt(i) << 8;
          for (let j = 0; j < 8; j++) {
            crc = crc & 0x8000 ? (crc << 1) ^ 0x1021 : crc << 1;
            crc &= 0xffff;
          }
        }
        return crc.toString(16).toUpperCase().padStart(4, "0");
      }

      // Sinh chuỗi EMVCo VietQR (NAPAS 247)
      function buildVietQR(bankCode, account, amount, addInfo, accountName) {
        const bin = BANK_BIN[bankCode];
        if (!bin) return null;

        const beneficiary = tlv("00", bin) + tlv("01", account);
        const merchantInfo =
          tlv("00", "A000000727") +
          tlv("01", beneficiary) +
          tlv("02", "QRIBFTTA");
        const tag38 = tlv("38", merchantInfo);

        // Nội dung CK — đặt ở cả 62.01 (Bill Number) và 62.08 (Purpose)
        let tag62 = "";
        if (addInfo) {
          const inner = tlv("01", addInfo) + tlv("08", addInfo);
          tag62 = tlv("62", inner);
        }

        let payload =
          tlv("00", "01") +
          tlv("01", "12") +
          tag38 +
          tlv("53", "704") +
          (amount > 0 ? tlv("54", String(amount)) : "") +
          tlv("58", "VN") +
          (accountName ? tlv("59", accountName.substring(0, 25)) : "") +
          tlv("60", "HO CHI MINH") +
          tag62;

        payload += "6304";
        return payload + crc16(payload);
      }

      // ============================================================
      //  TIỆN ÍCH SỐ — hỗ trợ dấu chấm phân cách nghìn
      // ============================================================
      // "1.000.000" → 1000000 ; "1000000" → 1000000
      function parseVN(s) {
        return parseFloat(String(s).replace(/\./g, '').replace(/,/g, '.')) || 0;
      }
      // 1000000 → "1.000.000"
      function formatVN(n) {
        return Math.round(n || 0).toLocaleString('vi-VN');
      }

      // ============================================================
      //  QUẢN LÝ DÒNG HÀNG
      // ============================================================
      const items = document.getElementById("items");
      const total = document.getElementById("total");

      function addRow(name = "Item Name", qty = 1, price = 0) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><input value="${name}"></td>
          <td class="right"><input class="qty" type="number" value="${qty}" oninput="calc()"></td>
          <td class="right"><input class="price" type="text" inputmode="numeric" value="${formatVN(price)}" oninput="calc()" onblur="formatPrice(this)"></td>
          <td class="right line">0</td>
          <td class="no-print delete" onclick="this.closest('tr').remove();calc()">✕</td>
        `;
        items.appendChild(tr);
        calc();
      }

      // Format đơn giá khi rời ô: "1000000" → "1.000.000"
      function formatPrice(el) {
        const v = parseVN(el.value);
        el.value = formatVN(v);
        calc();
      }

      function calc() {
        let sum = 0;

        items.querySelectorAll("tr").forEach((tr) => {
          const q = +tr.children[1].querySelector("input")?.value || 0;
          const p = parseVN(tr.children[2].querySelector("input")?.value);
          const t = q * p;

          const line = tr.querySelector(".line");
          if (line) line.textContent = t.toLocaleString("vi-VN");

          sum += t;
        });

        document.getElementById("total").textContent = sum.toLocaleString("vi-VN");
        syncQR();
      }

      // ============================================================
      //  VẼ QR BẰNG qrcode-generator (KHÔNG LOGO, KHÔNG CHỮ)
      // ============================================================
      function syncQR() {
        const amount = parseInt(total.textContent.replace(/\D/g, "")) || 0;
        const bankCode = document.getElementById("bank").value;
        const account  = document.getElementById("account").value.trim();
        const owner    = document.getElementById("owner").value.trim();
        const content  = document.getElementById("content").value.trim();

        const qrBox = document.getElementById("qr");
        qrBox.innerHTML = "";

        if (!bankCode || !account) {
          qrBox.innerHTML =
            '<div style="font-size:12px;color:#999;padding:20px">Nhập đủ thông tin NH</div>';
          return;
        }

        const payload = buildVietQR(
          bankCode,
          account,
          amount,
          content || "Thanh toán",
          owner || "Chủ tài khoản"
        );

        if (!payload) {
          qrBox.innerHTML =
            '<div style="font-size:12px;color:#c00;padding:20px">Không hỗ trợ NH này</div>';
          return;
        }

        try {
          const qr = qrcode(0, "M");
          qr.addData(payload);
          qr.make();
          // cellSize=3 cho QR gọn khung 110px
          qrBox.innerHTML = qr.createImgTag(3, 4);
        } catch (err) {
          qrBox.innerHTML =
            '<div style="font-size:12px;color:#c00;padding:20px">Lỗi tạo QR</div>';
        }
      }

      // ============================================================
      //  KHỞI TẠO
      // ============================================================
      window.onload = () => {
        // Điền ngày hiện tại vào 3 ô Ngày / tháng / năm
        const pad = (n) => n.toString().padStart(2, "0");
        const now = new Date();
        document.getElementById("dateD").value = pad(now.getDate());
        document.getElementById("dateM").value = pad(now.getMonth() + 1);
        document.getElementById("dateY").value = now.getFullYear();

        // Nội dung CK mặc định theo mã HĐ
        document.getElementById("content").value =
          "HD " + document.getElementById("invoiceId").value;

        addRow("Sản phẩm A", 2, 150000);
        addRow("Dịch vụ B", 1, 250000);
      };
    </script>
  </body>
</html>
