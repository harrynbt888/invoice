    font-family: Arial, sans-serif;

h1{
    text-align:center;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:15px;
}

.card{
    display:block;
    text-decoration:none;
    color:#333;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    transition:0.2s;
}

.card:hover{
    background:#f5f5f5;
    transform:translateY(-2px);
}
</style>
