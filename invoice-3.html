  <div class="divider"></div>

  <div class="title">HÓA ĐƠN</div>

        class="edit"

  <table>

<script>
  const items = document.getElementById("items");

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function addItem(name = "", price = 0, qty = 1, ck = 0) {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td class="name">
        <input class="edit item-name" value="${escapeHtml(name)}" oninput="updateAll()">
        <span class="print-text item-name-print"></span>
      </td>

      <td>
        <input class="edit item-price" type="number" value="${price}" oninput="updateAll()">
        <span class="print-text item-price-print"></span>
      </td>

      <td>
        <input class="edit item-qty" type="number" value="${qty}" oninput="updateAll()">
        <span class="print-text item-qty-print"></span>
      </td>

      <td>
        <input class="edit item-ck" type="number" value="${ck}" oninput="updateAll()">
        <span class="print-text item-ck-print"></span>
      </td>

      <td>
        <span class="line">0</span>
      </td>

      <td class="no-print">
        <button type="button" class="delete-btn" onclick="removeItem(this)">Xóa</button>
      </td>
    `;

    items.appendChild(tr);
    updateAll();
  }

  function removeItem(button) {
    button.closest("tr").remove();
    updateAll();
  }

  function fmt(n) {
    return n.toLocaleString("vi-VN");
  }

  function updateAll() {
    let sum = 0;

    items.querySelectorAll("tr").forEach((tr) => {
      const nameInput = tr.querySelector(".item-name");
      const priceInput = tr.querySelector(".item-price");
      const qtyInput = tr.querySelector(".item-qty");
      const ckInput = tr.querySelector(".item-ck");

      const price = +priceInput.value || 0;
      const qty = +qtyInput.value || 0;
      const ck = +ckInput.value || 0;

      const lineTotal = Math.round(price * qty * (1 - ck / 100));

      tr.querySelector(".line").textContent = fmt(lineTotal);
      tr.querySelector(".item-name-print").textContent = nameInput.value;
      tr.querySelector(".item-price-print").textContent = fmt(price);
      tr.querySelector(".item-qty-print").textContent = qty;
      tr.querySelector(".item-ck-print").textContent = ck + "%";

      sum += lineTotal;
    });

    const d = +discount.value || 0;
    const pay = Math.round(sum * (1 - d / 100));

    total.textContent = fmt(sum);
    final.textContent = fmt(pay);

    discountPrint.textContent = d + "%";
    invoicePrint.textContent = invoiceId.value;
    datePrint.textContent = invoiceDate.value;
    customerPrint.textContent = customerName.value;

    JsBarcode("#barcode", invoiceId.value || "HD000000", {
      displayValue: false,
      height: 36,
      width: 2,
    });

    updateQR();
  }

  function updateQR() {
    const amount = final.textContent.replace(/\D/g, "");
    const addInfo = encodeURIComponent(invoiceId.value);
    const accountName = encodeURIComponent(owner.value);

    qr.src = `https://img.vietqr.io/image/${bank.value}-${account.value}-compact2.png?amount=${amount}&addInfo=${addInfo}&accountName=${accountName}`;
  }

  function loadImage(e) {
    const img = document.getElementById("printImg");
    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = () => {
      img.src = reader.result;
    };

    reader.readAsDataURL(file);
  }

  window.onload = () => {
    addItem("VÁY NỮ MÀU ROSE", 210000, 2);
  };
</script>
