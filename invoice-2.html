<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Hóa đơn bán hàng</title>

    <style>
      @page { size: A4; margin: 10mm; }
      body {
        margin: 0;
        font-family: Inter, Roboto, Arial, sans-serif;
        font-size: 13px;
        color: #111;
      }
      .invoice {
        border: 1px solid #ddd;
        padding: 12mm;
        min-height: 270mm;
        box-sizing: border-box;
      }
      input, select {
        border: none;
        border-bottom: 1px dashed #aaa;
        font-size: 13px;
        background: transparent;
      }
      input:focus, select:focus { outline: none; }

      /* HEADER */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .company b { font-size: 17px; }
      .logo-print {
        max-width: 120px;
        max-height: 70px;
        object-fit: contain;
      }

      /* TITLE */
      .title { text-align: center; margin: 6px 0; }
      .title h1 { margin: 0; font-size: 20px; }

      /* INFO */
      .info { width: 100%; border-collapse: collapse; margin: 6px 0; }
      .info td { padding: 4px; }

      /* TABLE */
      .table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 6px;
        table-layout: fixed;
      }
      .table th, .table td {
        border: 1px solid #000;
        padding: 4px;
        font-size: 12px;
        text-align: center;
        word-break: break-word;
        vertical-align: middle;
      }
      .table th { background: #f5f7fa; }

      .table th:nth-child(1), .table td:nth-child(1) { width: 30px; }
      .table th:nth-child(2), .table td:nth-child(2) {
        width: auto;
        min-width: 150px;
        text-align: left;
        white-space: normal;
        word-break: break-word;
        padding: 6px;
      }
      .table th:nth-child(3), .table td:nth-child(3) { width: 50px; }
      .table th:nth-child(4), .table td:nth-child(4) { width: 50px; }
      .table th:nth-child(5), .table td:nth-child(5) { width: 80px; }
      .table th:nth-child(6), .table td:nth-child(6) { width: 80px; }
      .table th:nth-child(7), .table td:nth-child(7) { width: 30px; }

      .table td input {
        width: 100%;
        box-sizing: border-box;
        border: none;
        text-align: right;
        background: transparent;
      }
      .table td:nth-child(2) input { text-align: left; }

      /* TOTAL */
      .total { margin-top: 8px; }

      /* QR — vẽ client-side, ép cứng kích thước */
      .qr-wrap {
        text-align: center;
        margin-top: 12px;
      }
      #qr {
        width: 140px;
        height: 140px;
        margin: 0 auto;
        overflow: hidden;
      }
      #qr img {
        display: block !important;
        width: 140px !important;
        height: 140px !important;
        image-rendering: -webkit-optimize-contrast;
      }

      /* BUTTON */
      .btn {
        margin-top: 10px;
        padding: 8px 14px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      @media print {
        .no-print { display: none; }
        input, select { border: none; color: #000; }

        .qr-wrap {
          page-break-inside: avoid;
          break-inside: avoid;
        }
        #qr {
          width: 140px !important;
          height: 140px !important;
          display: block !important;
          margin: 0 auto !important;
        }
        #qr img {
          width: 140px !important;
          height: 140px !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
    </style>

    <!-- Thư viện sinh QR client-side (nhẹ, không logo) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  </head>

  <body>
    <div class="invoice">
      <!-- HEADER -->
      <div class="header">
        <div class="company">
          <b contenteditable="true">CỬA HÀNG ABC</b><br />
        </div>
        <div>
          <img id="logoPrint" class="logo-print" /><br />
          <input
            type="file"
            accept="image/*"
            onchange="loadLogo(this)"
            class="no-print"
          />
        </div>
      </div>

      <!-- TITLE -->
      <div class="title">
        <h1>HÓA ĐƠN BÁN HÀNG</h1>
        <p>
          Mã hóa đơn:
          <input id="invoiceId" value="HD00001" oninput="updateAll()"
                 style="width: 200px" />
        </p>
        <p>
          Ngày <input style="width: 30px" /> / <input style="width: 30px" /> /
          <input style="width: 50px" />
        </p>
      </div>

      <!-- INFO -->
      <table class="info">
        <tr>
          <td width="25%">Khách hàng:</td>
          <td><input value="NGUYỄN VĂN A" /></td>
        </tr>
      </table>

      <!-- TABLE -->
      <table class="table">
        <thead>
          <tr>
            <th>STT</th>
            <th>Tên hàng</th>
            <th>ĐVT</th>
            <th>SL</th>
            <th>Đơn giá</th>
            <th>Thành tiền</th>
            <th class="no-print"></th>
          </tr>
        </thead>
        <tbody id="items"></tbody>
      </table>

      <button class="no-print" onclick="addItem()">➕ Thêm dòng</button>

      <!-- TOTAL -->
      <div class="total">
        <p>Tổng tiền: <b id="total">0</b></p>
        <p>
          Giảm (%):
          <input id="discount" type="number" value="0"
                 style="width: 60px" oninput="updateAll()" />
        </p>
        <p>
          <b>Thanh toán: <span id="final">0</span></b>
        </p>
      </div>

      <!-- BANK INFO -->
      <div class="total">
        <p>
          Ngân hàng:
          <select id="bank" onchange="updateQR()">
            <option value="VCB">Vietcombank</option>
            <option value="ABB">ABBank</option>
            <option value="SHBVN">SOL</option>
            <option value="ACB">ACB</option>
            <option value="AGRIBANK">Agribank</option>
            <option value="BAB">Bac A Bank</option>
            <option value="BAOVIETBANK">BaoViet Bank</option>
            <option value="BIDV">BIDV</option>
            <option value="BVB">BVBank</option>
            <option value="EIB">Eximbank</option>
            <option value="HDB">HDBank</option>
            <option value="ICB">VietinBank</option>
            <option value="KLB">KienlongBank</option>
            <option value="MB">MB Bank</option>
            <option value="MSB">MSB</option>
            <option value="NAB">Nam A Bank</option>
            <option value="OCB">OCB</option>
            <option value="PGB">PG Bank</option>
            <option value="PVCOMBANK">PVcomBank</option>
            <option value="SAIGONBANK">SaigonBank</option>
            <option value="SCB">SCB</option>
            <option value="SEAB">SeABank</option>
            <option value="SHB">SHB</option>
            <option value="STB">Sacombank</option>
            <option value="TCB">Techcombank</option>
            <option value="TPB">TPBank</option>
            <option value="VIB">VIB</option>
            <option value="VPB">VPBank</option>
            <option value="NCB">NCB</option>
            <option value="VIKKI">VIKKI</option>
          </select>
        </p>
        <p>
          STK: <input id="account" value="0123456789" oninput="updateQR()" />
        </p>
        <p>
          Chủ TK: <input id="owner" value="NGUYEN VAN A" oninput="updateQR()" />
        </p>
      </div>

      <!-- QR -->
      <div class="qr-wrap">
        <div id="qr"></div>
      </div>

      <div class="footer"
           style="text-align:center;font-size:11px;color:#666;margin-top:10px">
        Cảm ơn quý khách đã mua hàng!
      </div>

      <button class="btn no-print" onclick="printInvoice()">
        🖨 In hóa đơn
      </button>
    </div>

    <script>
      // ============================================================
      //  MÃ BIN NGÂN HÀNG (theo NAPAS - dùng cho VietQR EMVCo)
      // ============================================================
      const BANK_BIN = {
        VCB: "970436", TCB: "970407", ICB: "970415", BIDV: "970418",
        AGRIBANK: "970405", MB: "970422", ACB: "970416", VPB: "970432",
        TPB: "970423", STB: "970403", HDB: "970437", SHB: "970443",
        VIB: "970441", MSB: "970426", OCB: "970448", SEAB: "970440",
        EIB: "970431", NAB: "970428", SCB: "970429", PGB: "970430",
        KLB: "970452", BVB: "970454", BAOVIETBANK: "970438",
        PVCOMBANK: "970412", SAIGONBANK: "970400", ABB: "970425",
        NCB: "970419", SHBVN: "970409", BAB: "970409", VIKKI: "970406"
      };

      // TLV: tag + length (2 số) + value
      function tlv(tag, val) {
        const len = String(val.length).padStart(2, "0");
        return tag + len + val;
      }

      // CRC-16/CCITT-FALSE (chuẩn EMVCo)
      function crc16(str) {
        let crc = 0xffff;
        for (let i = 0; i < str.length; i++) {
          crc ^= str.charCodeAt(i) << 8;
          for (let j = 0; j < 8; j++) {
            crc = crc & 0x8000 ? (crc << 1) ^ 0x1021 : crc << 1;
            crc &= 0xffff;
          }
        }
        return crc.toString(16).toUpperCase().padStart(4, "0");
      }

      // Sinh chuỗi EMVCo VietQR (NAPAS 247)
      function buildVietQR(bankCode, account, amount, addInfo, accountName) {
        const bin = BANK_BIN[bankCode];
        if (!bin) return null;

        const beneficiary = tlv("00", bin) + tlv("01", account);
        const merchantInfo =
          tlv("00", "A000000727") +
          tlv("01", beneficiary) +
          tlv("02", "QRIBFTTA");
        const tag38 = tlv("38", merchantInfo);

        let tag62 = "";
        if (addInfo) tag62 = tlv("62", tlv("01", addInfo));

        let payload =
          tlv("00", "01") +
          tlv("01", "12") +
          tag38 +
          tlv("53", "704") +
          (amount > 0 ? tlv("54", String(amount)) : "") +
          tlv("58", "VN") +
          (accountName ? tlv("59", accountName.substring(0, 25)) : "") +
          tlv("60", "HO CHI MINH") +
          tag62;

        payload += "6304";
        return payload + crc16(payload);
      }

      // ============================================================
      //  QUẢN LÝ SẢN PHẨM
      // ============================================================
      const items = document.getElementById("items");

      function addItem(name = "", qty = 1, price = 0) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td></td>
          <td contenteditable="true" class="name">${name}</td>
          <td><input></td>
          <td><input type="number" value="${qty}"></td>
          <td><input type="number" value="${price}"></td>
          <td class="line">0</td>
          <td class="no-print"><button onclick="this.closest('tr').remove();updateAll()">✕</button></td>
        `;
        items.appendChild(tr);

        tr.querySelectorAll("input").forEach((i) => (i.oninput = updateAll));
        tr.querySelector(".name").oninput = updateAll;

        updateAll();
      }

      function fmt(n) {
        return (n || 0).toLocaleString("vi-VN");
      }

      function updateAll() {
        let sum = 0;
        [...items.children].forEach((tr, i) => {
          tr.children[0].textContent = i + 1;
          const q = +tr.children[3].querySelector("input").value || 0;
          const p = +tr.children[4].querySelector("input").value || 0;
          const t = q * p;
          tr.querySelector(".line").textContent = fmt(t);
          sum += t;
        });
        const d = +discount.value || 0;
        const pay = Math.round(sum * (1 - d / 100));
        total.textContent = fmt(sum);
        final.textContent = fmt(pay);

        updateQR();
      }

      // ============================================================
      //  VẼ QR BẰNG qrcode-generator (KHÔNG LOGO, KHÔNG CHỮ)
      // ============================================================
      function updateQR() {
        const bankCode = bank.value;
        const acc = account.value.trim();
        const name = owner.value.trim();
        const invoiceIdVal = invoiceId.value.trim();

        const amountText = final.textContent.replace(/\D/g, "");
        const amount = parseInt(amountText, 10) || 0;

        const qrBox = document.getElementById("qr");
        qrBox.innerHTML = "";

        if (!bankCode || !acc) {
          qrBox.innerHTML =
            '<div style="font-size:11px;color:#999">Nhập đủ thông tin NH</div>';
          return;
        }

        const payload = buildVietQR(
          bankCode,
          acc,
          amount,
          invoiceIdVal,     // nội dung CK = mã hóa đơn
          name
        );

        if (!payload) {
          qrBox.innerHTML =
            '<div style="font-size:11px;color:#c00">Không hỗ trợ NH này</div>';
          return;
        }

        try {
          const qr = qrcode(0, "M");
          qr.addData(payload);
          qr.make();
          qrBox.innerHTML = qr.createImgTag(4, 4);
        } catch (err) {
          qrBox.innerHTML =
            '<div style="font-size:11px;color:#c00">Lỗi tạo QR</div>';
        }
      }

      // ============================================================
      //  IN — QR đã local nên chỉ cần gọi print
      // ============================================================
      function printInvoice() {
        window.print();
      }

      function loadLogo(input) {
        if (input.files[0]) {
          const r = new FileReader();
          r.onload = (e) => (logoPrint.src = e.target.result);
          r.readAsDataURL(input.files[0]);
        }
      }

      window.onload = () => addItem("Sản phẩm 1", 1, 100000);
    </script>
  </body>
</html>
